<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Operativo — SMU GO Empresas</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <!-- CABECERA DEL DASHBOARD -->
    <header class="sticky-top bg-white border-bottom shadow-sm py-2">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center gap-2 text-decoration-none" href="dashboard.html">
                <span class="gradient-brand text-white fw-bold rounded-3 px-3 py-1 fs-5">S</span>
                <div>
                    <span class="fw-bold d-block lh-1 text-dark">SMU GO Empresas</span>
                    <small class="text-muted text-uppercase brand-subtitle">Panel de Control</small>
                </div>
            </a>
            
            <div class="d-flex align-items-center gap-3">
                <span class="small text-muted d-none d-md-inline" id="userEmailDisplay">operacion@empresa.mx</span>
                <a href="index.html" class="btn btn-outline-danger btn-sm" id="btnCerrarSesion">
                    <i class="fa-solid fa-right-from-bracket me-1"></i> Cerrar sesión
                </a>
            </div>
        </div>
    </header>

    <!-- LAYOUT CON SIDEBAR E IFRAME CONTENEDOR -->
    <div class="admin-layout flex-grow-1 d-flex overflow-hidden">
        
        <!-- SIDEBAR DE NAVEGACIÓN -->
        <aside class="sidebar p-3 flex-shrink-0">
            <ul class="nav nav-pills flex-column" id="sidebarMenu">
                <li class="nav-item">
                <!-- El atributo target debe coincidir con el name del iframe -->
                    <a href="resumen.html" target="adminFrame" class="nav-link active">
                        <i class="fa-solid fa-chart-line me-2"></i> Resumen
                    </a>
                </li>
                <li class="nav-item">
                    <a href="conductores.html" target="adminFrame" class="nav-link active">
                        <i class="fa-solid fa-id-card me-2"></i> Conductores
                    </a>
                </li>
                <li class="nav-item">
                    <a href="rutas.html" target="adminFrame" class="nav-link">
                        <i class="fa-solid fa-route me-2"></i> Rutas y Horarios
                    </a>
                </li>
                <li class="nav-item">
                    <a href="unidades.html" target="adminFrame" class="nav-link">
                        <i class="fa-solid fa-bus me-2"></i> Flota / Unidades
                    </a>
                </li>
            </ul>
        </aside>

        <!-- MARCO CONTENEDOR QUE RENDERIZA LOS OTROS ARCHIVOS HTML -->
        <main class="flex-grow-1 bg-light">
            <iframe name="adminFrame" src="conductores.html" class="w-100 h-100 border-0"></iframe>
        </main>
    </div>

    <!-- PIE DE PÁGINA (FOOTER) -->
    <footer class="border-top bg-white py-4">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3 text-muted small">
            <p class="mb-0">© 2026 SMU GO · Desarrollado por <strong>Omnix Technologies</strong>. Plataforma demostrativa.</p>
        </div>
    </footer>    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
