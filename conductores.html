<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1">Gestión de Conductores</h1>
            <p class="text-muted small mb-0">Administra expedientes, licencias y unidades asignadas.</p>
        </div>
        <button class="btn btn-primary btn-sm"><i class="fa-solid fa-plus me-1"></i> Registrar Conductor</button>
    </div>

    <div class="surface-card p-4">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr class="text-muted small">
                        <th>Nombre</th>
                        <th>Licencia</th>
                        <th>Estatus</th>
                        <th>Unidad Asignada</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody class="small">
                    <tr>
                        <td class="fw-semibold">Carlos Ramírez Pérez</td>
                        <td>LIC-89210-B</td>
                        <td><span class="badge bg-success">Activo</span></td>
                        <td>Unidad #102</td>
                        <td><button class="btn btn-light btn-sm"><i class="fa-solid fa-pen"></i></button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
